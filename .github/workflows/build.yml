name: Build IPA for TrollStore

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Debug File Structure
        run: |
          echo "Current Directory Structure:"
          ls -R
        # هذا الأمر سيطبع كل الملفات والمجلدات في السجلات لنعرف أين المشكلة

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Build archive
        run: |
          xcodebuild clean archive \
            -project SolarEngineer.xcodeproj \
            -scheme SolarEngineer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/SolarEngineer.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER=com.yourcompany.SolarEngineer \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Export IPA
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict></dict>
          </dict>
          </plist>' > exportOptions.plist
          
          xcodebuild -exportArchive \
            -archivePath build/SolarEngineer.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist \
            PRODUCT_BUNDLE_IDENTIFIER=com.yourcompany.SolarEngineer \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Save IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolarEngineer-IPA
          path: build/ipa/**/*.ipa
