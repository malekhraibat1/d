name: SolarEngineer
options:
  deploymentTarget: "17.0"

targets:
  SolarEngineer:
    type: application
    platform: iOS
    info:
      CFBundleIdentifier: com.yourcompany.SolarEngineer
      CFBundleShortVersionString: "1.0.0"
      CFBundleVersion: "1"
      CFBundleName: "SolarEngineer"
      UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.SolarEngineer
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 1
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Views
      - path: Theme
