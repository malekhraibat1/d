name: SolarEngineer
options:
  deploymentTarget: "17.0"

targets:
  SolarEngineer:
    type: application
    platform: iOS
    # هنا وضعنا المعرف داخل التارجت لضمان رؤيته من قبل xcodebuild
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.SolarEngineer
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 1
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Views
      - path: Theme
