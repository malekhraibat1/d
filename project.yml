name: SolarEngineer

options:
  bundleIdPrefix: com.malek
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  SolarEngineer:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Views
      - path: Theme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.malek.SolarEngineer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSCameraUsageDescription: "نحتاج الكاميرا لعرض المخطط فوق السطح بالواقع المعزز"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "لتحديد موقع المشروع وحساب الإنتاج الشمسي"
        INFOPLIST_KEY_NSMotionUsageDescription: "لقياس ميل السطح واتجاهه بدقة"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "لحفظ صور المشاريع والفواتير"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "لتسجيل التعليق الصوتي أثناء فيديو AR"
        TARGETED_DEVICE_FAMILY: "1,2"
