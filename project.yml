name: SolarEngineer
options:
  deploymentTarget: "17.0"

targets:
  SolarEngineer:
    type: application
    platform: iOS
    bundleIdentifier: com.yourcompany.SolarEngineer # تعريف مباشر
    info:
      CFBundleIdentifier: com.yourcompany.SolarEngineer
      CFBundleShortVersionString: "1.0.0"
      CFBundleVersion: "1"
      CFBundleName: "SolarEngineer"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.SolarEngineer
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Views
      - path: Theme
